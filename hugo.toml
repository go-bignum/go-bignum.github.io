baseURL = 'https://go-bignum.github.io/'
locale  = 'en-us'
title   = 'go-bignum'
# No theme -- the layout is the go-* family template: one self-contained
# layouts/index.html, and the shared design (styles, theme toggle, fork ribbon,
# icons) imported as the Hugo module github.com/go-fleettools/landingkit,
# pinned in go.mod.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-bignum: arbitrary precision in pure Go (CGO=0). Correctly rounded elementary functions and constants on math/big.Float, at any precision and in all six rounding modes, and the Go harness that checks them against mpmath."

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
[[params.repos]]
  name  = "bigfloat"
  kind  = "released v0.1.0"
  href  = "https://github.com/go-bignum/bigfloat"
  blurb = "Released v0.1.0; every function is at or below mpmath's time on one core (0.18–0.97× at 53–200 bits, 0.27–0.92× at 1000 bits; <a href=\"https://github.com/go-bignum/bigfloat/blob/v0.1.0/docs/perf.md\">docs/perf.md</a>). Correctly rounded roots, exponentials and logarithms, trigonometric and hyperbolic functions, <code>Pow</code> and the constants π, e, ln 2, ln 10 and γ on <code>math/big.Float</code>, at any precision and in all six rounding modes; the <code>oracle</code> package drives mpmath from Go for correctly rounded reference values and golden fixtures."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-bignum.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): one section per library, made of its own README. <a href=\"https://github.com/go-bignum/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-bignum/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The cards of #exact and their count come from this list. Each statement is
# from the README of the library it names, as of v0.1.0.
[[params.checks]]
  name = "Golden fixtures from mpmath"
  what = "28 840 cases over the 29 functions and constants, at 24, 53, 64, 113, 200 and 1000 bits, each checked in all six rounding modes, value, sign of zero and accuracy: 173 040 results, all identical to the certified roundings. (bigfloat)"
[[params.checks]]
  name = "Fuzzing"
  what = "`FuzzFunctions` compares every function, mode and precision with the oracle at more than twice the precision; only `ErrNaN` and `ErrLimit` may panic. (bigfloat)"
[[params.checks]]
  name = "Coverage and architectures"
  what = "100% statement coverage with `-race`, and the fixtures on amd64, arm64, 386, arm, riscv64, loong64, ppc64le and s390x in CI. (bigfloat)"

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 6.82:1, bright on the dark background 7.09:1.
  base = "#a02a74"
  deep = "#621a47"
  bright = "#e27ab8"
  shadow = "rgba(160,42,116,.7)"
  glow = "rgba(160,42,116,.6)"
  wash = "rgba(160,42,116,.10)"
  washDeep = "rgba(98,26,71,.06)"
  chipBg = "#fceff6"
  chipBorder = "#f6d7ea"
  chipFg = "#621a47"
  chipBgDark = "rgba(226,122,184,.14)"
  chipBorderDark = "rgba(226,122,184,.32)"
  chipFgDark = "#efb6d8"
  statsEnd = "#f8dfee"
  bandText = "#faeaf4"
